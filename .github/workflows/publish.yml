name: packagist

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  update:

    runs-on: ubuntu-latest

    name: Update Packagist

    steps:
      - name: Notify Packagist
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer GautierDele:${{ secrets.PACKAGIST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":"https://github.com/Lomkit/laravel-osdd"}' \
            https://packagist.org/api/update-package
