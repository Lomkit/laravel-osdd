name: tests

on:
  push:
    branches: [ 2.x, 3.x ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.3', '8.4', '8.5' ]
        laravel: [ '13' ]
        dependencies: [ 'highest' ]
        integrations: [ 'none' ]
        include:
          # The oldest versions allowed by composer.json
          - php-version: '8.3'
            laravel: '13'
            dependencies: 'lowest'
            integrations: 'none'
          - php-version: '8.4'
            laravel: '13'
            dependencies: 'highest'
            integrations: 'livewire-filament'

    name: PHP ${{ matrix.php-version }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependencies }}${{ matrix.integrations != 'none' && format(' - {0}', matrix.integrations) || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Only downloaded archives are cached; dependencies are resolved on every run,
      # so new releases and composer.json changes are always picked up
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ matrix.integrations }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ matrix.integrations }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-interaction --no-update
          if [ "${{ matrix.integrations }}" = "livewire-filament" ]; then composer require --dev "livewire/livewire:^4.0" "filament/filament:^5.0" --no-interaction --no-update; fi
          composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run test suite
        run: vendor/bin/phpunit ${{ matrix.integrations == 'livewire-filament' && 'tests/Livewire tests/Filament' || '' }}
